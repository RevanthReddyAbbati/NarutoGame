<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Naruto: Shadow of the Shinobi | Fixed Monolith</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>

    <style>
        :root {
            --anime-orange: #ff6b00;
            --chakra-blue: #00dfff;
            --hp-red: #ff2a5f;
            --stamina-green: #2ae876;
            --dark-bg: rgba(6, 10, 18, 0.85);
            --border-glow: rgba(255, 107, 0, 0.4);
        }

        body, html {
            margin: 0; padding: 0; overflow: hidden;
            width: 100%; height: 100%;
            background-color: #030508;
            font-family: 'Segoe UI', system-ui, sans-serif;
            user-select: none; -webkit-user-select: none;
            touch-action: none;
        }

        #game-container {
            width: 100%; height: 100%; position: absolute; z-index: 1; top: 0; left: 0;
        }

        #flash-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: white; opacity: 0; pointer-events: none; z-index: 5;
            transition: opacity 0.1s ease-out;
        }

        /* HUD Layer Setup */
        #hud-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 10; pointer-events: none;
            display: flex; flex-direction: column; justify-content: space-between;
            padding: 15px; box-sizing: border-box;
            opacity: 0; transition: opacity 0.3s ease;
        }

        .hud-top-left { display: flex; flex-direction: column; gap: 10px; }

        .hud-character-card {
            background: var(--dark-bg); backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.08); border-left: 5px solid var(--anime-orange);
            padding: 10px 15px; border-radius: 4px; display: flex; align-items: center; gap: 12px;
            pointer-events: auto; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .avatar-frame {
            font-size: 24px; background: rgba(255,255,255,0.05);
            width: 44px; height: 44px; display: flex; align-items: center;
            justify-content: center; border-radius: 50%; border: 1px solid var(--chakra-blue);
            animation: rotateAura 6s linear infinite;
        }

        .bars-container { display: flex; flex-direction: column; gap: 4px; }
        .stat-bar-wrapper { display: flex; align-items: center; gap: 8px; }
        .bar-label { font-size: 10px; font-weight: 900; color: #fff; width: 25px; letter-spacing: 1px; }

        .bar-track {
            width: 160px; height: 8px; background: rgba(0,0,0,0.6);
            border-radius: 4px; overflow: hidden; border: 1px solid rgba(255,255,255,0.05);
        }

        @media (min-width: 768px) {
            .bar-track { width: 220px; }
        }

        .bar-fill { height: 100%; width: 100%; transition: width 0.15s ease; }
        .hp-gradient { background: linear-gradient(90deg, #b0002a, var(--hp-red)); box-shadow: 0 0 8px var(--hp-red); }
        .chakra-gradient { background: linear-gradient(90deg, #0066cc, var(--chakra-blue)); box-shadow: 0 0 8px var(--chakra-blue); }
        .stamina-gradient { background: linear-gradient(90deg, #169e49, var(--stamina-green)); box-shadow: 0 0 8px var(--stamina-green); }

        #level-indicator {
            color: #fff; font-size: 10px; font-weight: 800; letter-spacing: 2px;
            background: rgba(0,0,0,0.4); padding: 4px 8px; width: fit-content; border-radius: 3px;
        }

        .hud-top-right { display: flex; flex-direction: column; align-items: flex-end; gap: 10px; }

        #combo-box { text-align: right; display: none; }
        #combo-count {
            font-size: 48px; font-weight: 900; color: #fff; line-height: 1;
            text-shadow: 0 0 20px var(--anime-orange), 0 0 40px #ff0000;
            font-style: italic;
        }
        #combo-label { font-size: 12px; font-weight: 800; color: var(--anime-orange); letter-spacing: 3px; }

        #score-box {
            background: var(--dark-bg); color: #fff; font-weight: 800; padding: 6px 12px;
            border-radius: 4px; border: 1px solid rgba(255,255,255,0.05); letter-spacing: 1.5px; font-size: 14px;
        }

        /* Menu Systems */
        .overlay-visible {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, #101624 0%, #030509 100%);
            z-index: 100; display: flex; justify-content: center; align-items: center;
            transition: opacity 0.4s ease, transform 0.4s ease; opacity: 1;
        }
        .overlay-hidden { opacity: 0; pointer-events: none; transform: scale(1.05); }

        .menu-content { text-align: center; max-width: 600px; padding: 20px; box-sizing: border-box; width: 100%; }
        .glow-title {
            font-size: 38px; font-weight: 900; color: #fff; margin: 0;
            letter-spacing: 4px; text-shadow: 0 0 30px var(--border-glow);
        }
        @media (min-width: 768px) { .glow-title { font-size: 56px; letter-spacing: 6px; } }
        
        .menu-sub { color: var(--chakra-blue); letter-spacing: 4px; font-size: 12px; margin-top: 5px; }
        .accent-line { border: none; height: 2px; background: linear-gradient(90deg, transparent, var(--anime-orange), transparent); margin: 20px 0; }

        .menu-actions { display: flex; flex-direction: column; gap: 15px; align-items: center; position: relative; z-index: 110; }

        .menu-btn {
            background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1);
            color: #fff; width: 260px; padding: 14px; font-size: 14px; font-weight: 700;
            letter-spacing: 3px; border-radius: 4px; cursor: pointer; pointer-events: auto;
            transition: all 0.25s ease; -webkit-tap-highlight-color: transparent;
        }
        .menu-btn:hover, .menu-btn:active {
            background: rgba(255, 107, 0, 0.1); border-color: var(--anime-orange);
            box-shadow: 0 0 20px var(--border-glow);
        }
        .primary-glow { background: var(--anime-orange); color: #000; border: none; font-weight: 800; }
        .primary-glow:hover, .primary-glow:active { background: #ff8533; color: #000; box-shadow: 0 0 30px rgba(255,107,0,0.6); }

        .control-legend { margin-top: 25px; font-size: 11px; color: #5c6982; line-height: 1.6; padding: 0 10px; }

        .modal-hidden { display: none !important; }
        #settings-modal {
            position: absolute; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85);
            z-index: 200; display:flex; justify-content:center; align-items:center;
        }
        .modal-content {
            background: #0d131f; border: 1px solid rgba(255,255,255,0.1); padding: 30px;
            border-radius: 6px; width: 320px; text-align: center; box-sizing: border-box;
        }
        .modal-content h2 { font-size: 16px; letter-spacing: 2px; color: #fff; margin-bottom: 25px; }
        .setting-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; color: #a2afc7; font-size: 12px; font-weight: 600; }

        /* Dynamic Touch Control UI */
        #mobile-controls { display: none; width: 100%; pointer-events: none; box-sizing: border-box; }

        @media (max-width: 900px) {
            #mobile-controls { display: flex; justify-content: space-between; align-items: flex-end; pointer-events: none; }
            .m-btn {
                pointer-events: auto; width: 60px; height: 60px; border-radius: 50%;
                background: rgba(6, 10, 18, 0.75); border: 2px solid rgba(255,255,255,0.15);
                color: white; font-weight: 900; font-size: 11px; -webkit-tap-highlight-color: transparent;
            }
            .m-btn:active { background: var(--anime-orange); color: #000; }
            #joystick-zone {
                width: 110px; height: 110px; background: rgba(255,255,255,0.03);
                border-radius: 50%; pointer-events: auto; position: relative; border: 2px solid rgba(255,255,255,0.1);
            }
            #joystick-thumb {
                width: 44px; height: 44px; background: var(--anime-orange);
                border-radius: 50%; position: absolute; top: 33px; left: 33px; pointer-events: none;
            }
            #action-buttons-zone { display: flex; gap: 10px; }
        }

        @keyframes rotateAura { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="game-container"></div>
    <div id="flash-overlay"></div>

    <div id="hud-layer">
        <div class="hud-top-left">
            <div class="hud-character-card">
                <div class="avatar-frame">🌀</div>
                <div class="bars-container">
                    <div class="stat-bar-wrapper">
                        <span class="bar-label">VIT</span>
                        <div class="bar-track"><div id="bar-hp" class="bar-fill hp-gradient"></div></div>
                    </div>
                    <div class="stat-bar-wrapper">
                        <span class="bar-label">CHK</span>
                        <div class="bar-track"><div id="bar-chakra" class="bar-fill chakra-gradient"></div></div>
                    </div>
                    <div class="stat-bar-wrapper">
                        <span class="bar-label">STM</span>
                        <div class="bar-track"><div id="bar-stamina" class="bar-fill stamina-gradient"></div></div>
                    </div>
                </div>
            </div>
            <div id="level-indicator">RANK: <span id="rank-val">GENIN (LVL 1)</span></div>
        </div>

        <div class="hud-top-right">
            <div id="combo-box">
                <div id="combo-count">0</div>
                <div id="combo-label">RENGEKI</div>
            </div>
            <div id="score-box">SCORE: <span id="score-val">0</span></div>
        </div>

        <div id="mobile-controls">
            <div id="joystick-zone">
                <div id="joystick-thumb"></div>
            </div>
            <div id="action-buttons-zone">
                <button class="m-btn" id="m-attack">ATK</button>
                <button class="m-btn" id="m-jutsu">JUTSU</button>
                <button class="m-btn" id="m-dodge">DASH</button>
            </div>
        </div>
    </div>

    <div id="screen-overlay" class="overlay-visible">
        <div class="menu-content">
            <h1 class="glow-title">SHADOW OF THE SHINOBI</h1>
            <p class="menu-sub">ADVANCED WEBGL ANIME ENGINE</p>
            <hr class="accent-line">
            
            <div class="menu-actions">
                <button class="menu-btn primary-glow" id="start-mission-btn">COMMENCE MISSION</button>
                <button class="menu-btn" id="open-settings-btn">ENGINE SETTINGS</button>
            </div>

            <div class="control-legend">
                <p><strong>[W, A, S, D]</strong> Run Around | <strong>[Shift]</strong> Sprint Dash</p>
                <p><strong>[Left Click / J]</strong> Taijutsu Combo | <strong>[Spacebar]</strong> Jump | <strong>[E]</strong> Rasendan Blast</p>
            </div>
        </div>
    </div>

    <div id="settings-modal" class="modal-hidden">
        <div class="modal-content">
            <h2>ENGINE CONFIGURATION</h2>
            <div class="setting-row">
                <label>POST-PROCESSING BLOOM</label>
                <input type="checkbox" id="setting-bloom" checked>
            </div>
            <div class="setting-row">
                <label>DYNAMIC ENVIRONMENT FX</label>
                <input type="checkbox" id="setting-fx" checked>
            </div>
            <button class="menu-btn" id="close-settings-btn">SAVE & CLOSE</button>
        </div>
    </div>

    <script>
        // Global system variables
        window.EngineContext = null;

        // --- GLOBAL UI MANAGEMENT ROUTER ---
        const GameUI = {
            handleStart: () => {
                document.getElementById('screen-overlay').classList.add('overlay-hidden');
                document.getElementById('hud-layer').style.opacity = '1';
                if(window.EngineContext) {
                    window.EngineContext.bootSequence();
                }
            },
            toggleSettings: (open) => {
                document.getElementById('settings-modal').className = open ? '' : 'modal-hidden';
            },
            showGameOver: (score) => {
                const overlay = document.getElementById('screen-overlay');
                document.querySelector('.glow-title').innerText = "MISSION FAILED";
                document.querySelector('.glow-title').style.color = "#ff2a5f";
                document.querySelector('.menu-sub').innerText = `FINAL SCORE: ${score} SHINOBI BOUNTIES COLLECTED`;
                document.querySelector('.menu-actions').innerHTML = `<button class="menu-btn primary-glow" onclick="window.location.reload()">RE-ENTER ARENA</button>`;
                overlay.classList.remove('overlay-hidden');
                document.getElementById('hud-layer').style.opacity = '0';
            }
        };

        // UI Event Binding Interceptor to fix mobile touch locks
        document.addEventListener("DOMContentLoaded", () => {
            const startBtn = document.getElementById('start-mission-btn');
            const openSettingsBtn = document.getElementById('open-settings-btn');
            const closeSettingsBtn = document.getElementById('close-settings-btn');

            if(startBtn) {
                startBtn.addEventListener('click', GameUI.handleStart);
                startBtn.addEventListener('touchstart', (e) => { e.preventDefault(); GameUI.handleStart(); });
            }
            if(openSettingsBtn) {
                openSettingsBtn.addEventListener('click', () => GameUI.toggleSettings(true));
                openSettingsBtn.addEventListener('touchstart', (e) => { e.preventDefault(); GameUI.toggleSettings(true); });
            }
            if(closeSettingsBtn) {
                closeSettingsBtn.addEventListener('click', () => GameUI.toggleSettings(false));
                closeSettingsBtn.addEventListener('touchstart', (e) => { e.preventDefault(); GameUI.toggleSettings(false); });
            }

            // Initialize the engine instance
            window.EngineContext = new Engine();
        });

        class InputManager {
            constructor() {
                this.keys = { w: false, a: false, s: false, d: false, shift: false, space: false, e: false, j: false };
                this.mouse = { x: 0, y: 0 };
                this.joystick = { active: false, startX: 0, startY: 0, vector: new THREE.Vector2() };
                
                this.initKeyboardListeners();
                this.initMouseListeners();
                this.initTouchListeners();
            }

            initKeyboardListeners() {
                window.addEventListener('keydown', (e) => this.setKey(e, true));
                window.addEventListener('keyup', (e) => this.setKey(e, false));
            }

            setKey(event, isPressed) {
                const keyMap = {
                    'KeyW': 'w', 'ArrowUp': 'w',
                    'KeyA': 'a', 'ArrowLeft': 'a',
                    'KeyS': 's', 'ArrowDown': 's',
                    'KeyD': 'd', 'ArrowRight': 'd',
                    'ShiftLeft': 'shift', 'ShiftRight': 'shift',
                    'Space': 'space',
                    'KeyE': 'e',
                    'KeyJ': 'j'
                };
                const action = keyMap[event.code];
                if (action) {
                    this.keys[action] = isPressed;
                    if (event.code === 'Space') event.preventDefault();
                }
            }

            initMouseListeners() {
                window.addEventListener('mousemove', (e) => {
                    this.mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
                    this.mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
                });
                window.addEventListener('mousedown', (e) => { if(e.button === 0) this.keys.j = true; });
                window.addEventListener('mouseup', (e) => { if(e.button === 0) this.keys.j = false; });
            }

            initTouchListeners() {
                const zone = document.getElementById('joystick-zone');
                if(!zone) return;

                zone.addEventListener('touchstart', (e) => {
                    const touch = e.touches[0];
                    this.joystick.active = true;
                    this.joystick.startX = touch.clientX;
                    this.joystick.startY = touch.clientY;
                }, {passive: true});

                window.addEventListener('touchmove', (e) => {
                    if (!this.joystick.active) return;
                    const touch = e.touches[0];
                    let dx = touch.clientX - this.joystick.startX;
                    let dy = touch.clientY - this.joystick.startY;
                    
                    const maxDist = 40;
                    const dist = Math.hypot(dx, dy);
                    if (dist > maxDist) {
                        dx = (dx / dist) * maxDist;
                        dy = (dy / dist) * maxDist;
                    }

                    const thumb = document.getElementById('joystick-thumb');
                    if(thumb) thumb.style.transform = `translate(${dx}px, ${dy}px)`;
                    this.joystick.vector.set(dx / maxDist, -(dy / maxDist));
                }, {passive: true});

                window.addEventListener('touchend', () => {
                    if (!this.joystick.active) return;
                    this.joystick.active = false;
                    this.joystick.vector.set(0, 0);
                    const thumb = document.getElementById('joystick-thumb');
                    if(thumb) thumb.style.transform = `translate(0px, 0px)`;
                });

                const bindTouchTrigger = (elemId, targetAction) => {
                    const btn = document.getElementById(elemId);
                    if(btn) {
                        btn.addEventListener('touchstart', (e) => { e.preventDefault(); this.keys[targetAction] = true; });
                        btn.addEventListener('touchend', (e) => { e.preventDefault(); this.keys[targetAction] = false; });
                    }
                };

                bindTouchTrigger('m-attack', 'j');
                bindTouchTrigger('m-jutsu', 'e');
                bindTouchTrigger('m-dodge', 'shift');
            }

            getMovementVector() {
                let move = new THREE.Vector3();
                if (this.joystick.active) {
                    move.x = this.joystick.vector.x;
                    move.z = -this.joystick.vector.y;
                    return move;
                }
                if (this.keys.w) move.z -= 1;
                if (this.keys.s) move.z += 1;
                if (this.keys.a) move.x -= 1;
                if (this.keys.d) move.x += 1;
