<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Naruto: Shadow of the Shinobi | Ultimate Fixed Edition</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>

    <style>
        :root {
            --anime-orange: #ff6b00;
            --chakra-blue: #00dfff;
            --hp-red: #ff2a5f;
            --stamina-green: #2ae876;
            --dark-bg: rgba(6, 10, 18, 0.85);
            --border-glow: rgba(255, 107, 0, 0.4);
        }

        body, html {
            margin: 0; padding: 0; overflow: hidden;
            width: 100%; height: 100%;
            background-color: #030508;
            font-family: 'Segoe UI', system-ui, sans-serif;
            user-select: none; -webkit-user-select: none;
            touch-action: none;
        }

        #game-container {
            width: 100%; height: 100%; position: absolute; z-index: 1; top: 0; left: 0;
        }

        #flash-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: white; opacity: 0; pointer-events: none; z-index: 5;
            transition: opacity 0.1s ease-out;
        }

        /* Interface HUD Structure */
        #hud-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 10; pointer-events: none;
            display: flex; flex-direction: column; justify-content: space-between;
            padding: 15px; box-sizing: border-box;
            opacity: 0; transition: opacity 0.3s ease;
        }

        .hud-top-left { display: flex; flex-direction: column; gap: 10px; }

        .hud-character-card {
            background: var(--dark-bg); backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.08); border-left: 5px solid var(--anime-orange);
            padding: 10px 15px; border-radius: 4px; display: flex; align-items: center; gap: 12px;
            pointer-events: auto; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .avatar-frame {
            font-size: 24px; background: rgba(255,255,255,0.05);
            width: 44px; height: 44px; display: flex; align-items: center;
            justify-content: center; border-radius: 50%; border: 1px solid var(--chakra-blue);
            animation: rotateAura 6s linear infinite;
        }

        .bars-container { display: flex; flex-direction: column; gap: 4px; }
        .stat-bar-wrapper { display: flex; align-items: center; gap: 8px; }
        .bar-label { font-size: 10px; font-weight: 900; color: #fff; width: 25px; letter-spacing: 1px; }

        .bar-track {
            width: 160px; height: 8px; background: rgba(0,0,0,0.6);
            border-radius: 4px; overflow: hidden; border: 1px solid rgba(255,255,255,0.05);
        }

        @media (min-width: 768px) { .bar-track { width: 220px; } }

        .bar-fill { height: 100%; width: 100%; transition: width 0.15s ease; }
        .hp-gradient { background: linear-gradient(90deg, #b0002a, var(--hp-red)); box-shadow: 0 0 8px var(--hp-red); }
        .chakra-gradient { background: linear-gradient(90deg, #0066cc, var(--chakra-blue)); box-shadow: 0 0 8px var(--chakra-blue); }
        .stamina-gradient { background: linear-gradient(90deg, #169e49, var(--stamina-green)); box-shadow: 0 0 8px var(--stamina-green); }

        #level-indicator {
            color: #fff; font-size: 10px; font-weight: 800; letter-spacing: 2px;
            background: rgba(0,0,0,0.4); padding: 4px 8px; width: fit-content; border-radius: 3px;
        }

        .hud-top-right { display: flex; flex-direction: column; align-items: flex-end; gap: 10px; }

        #combo-box { text-align: right; display: none; }
        #combo-count {
            font-size: 48px; font-weight: 900; color: #fff; line-height: 1;
            text-shadow: 0 0 20px var(--anime-orange), 0 0 40px #ff0000;
            font-style: italic;
        }
        #combo-label { font-size: 12px; font-weight: 800; color: var(--anime-orange); letter-spacing: 3px; }

        #score-box {
            background: var(--dark-bg); color: #fff; font-weight: 800; padding: 6px 12px;
            border-radius: 4px; border: 1px solid rgba(255,255,255,0.05); letter-spacing: 1.5px; font-size: 14px;
        }

        /* Overlay Menu Screens */
        .overlay-visible {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, #101624 0%, #030509 100%);
            z-index: 100; display: flex; justify-content: center; align-items: center;
            transition: opacity 0.4s ease, transform 0.4s ease; opacity: 1;
            pointer-events: auto;
        }
        .overlay-hidden { opacity: 0; pointer-events: none; transform: scale(1.05); }

        .menu-content { text-align: center; max-width: 600px; padding: 20px; box-sizing: border-box; width: 100%; }
        .glow-title {
            font-size: 38px; font-weight: 900; color: #fff; margin: 0;
            letter-spacing: 4px; text-shadow: 0 0 30px var(--border-glow);
        }
        @media (min-width: 768px) { .glow-title { font-size: 56px; letter-spacing: 6px; } }
        
        .menu-sub { color: var(--chakra-blue); letter-spacing: 4px; font-size: 12px; margin-top: 5px; }
        .accent-line { border: none; height: 2px; background: linear-gradient(90deg, transparent, var(--anime-orange), transparent); margin: 20px 0; }

        .menu-actions { display: flex; flex-direction: column; gap: 15px; align-items: center; }

        .menu-btn {
            background: rgba(255,255,255,0.05); border: 2px solid rgba(255,255,255,0.15);
            color: #fff; width: 260px; padding: 14px; font-size: 14px; font-weight: 700;
            letter-spacing: 3px; border-radius: 4px; cursor: pointer; pointer-events: auto;
            transition: all 0.25s ease; -webkit-tap-highlight-color: transparent;
        }
        .menu-btn:hover, .menu-btn:active {
            background: rgba(255, 107, 0, 0.2); border-color: var(--anime-orange);
            box-shadow: 0 0 20px var(--border-glow);
        }
        .primary-glow { background: var(--anime-orange); color: #000; border: none; font-weight: 800; }
        .primary-glow:hover, .primary-glow:active { background: #ff8533; color: #000; box-shadow: 0 0 30px rgba(255,107,0,0.6); }

        .control-legend { margin-top: 25px; font-size: 11px; color: #5c6982; line-height: 1.6; padding: 0 10px; }

        .modal-hidden { display: none !important; }
        #settings-modal {
            position: absolute; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85);
            z-index: 200; display:flex; justify-content:center; align-items:center;
        }
        .modal-content {
            background: #0d131f; border: 1px solid rgba(255,255,255,0.1); padding: 30px;
            border-radius: 6px; width: 320px; text-align: center; box-sizing: border-box;
        }
        .modal-content h2 { font-size: 16px; letter-spacing: 2px; color: #fff; margin-bottom: 25px; }
        .setting-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; color: #a2afc7; font-size: 12px; font-weight: 600; }

        /* Touch Interfaces */
        #mobile-controls { display: none; width: 100%; pointer-events: none; box-sizing: border-box; }

        @media (max-width: 900px) {
            #mobile-controls { display: flex; justify-content: space-between; align-items: flex-end; pointer-events: none; }
            .m-btn {
                pointer-events: auto; width: 60px; height: 60px; border-radius: 50%;
                background: rgba(6, 10, 18, 0.75); border: 2px solid rgba(255,255,255,0.15);
                color: white; font-weight: 900; font-size: 11px; -webkit-tap-highlight-color: transparent;
            }
            .m-btn:active { background: var(--anime-orange); color: #000; }
            #joystick-zone {
                width: 110px; height: 110px; background: rgba(255,255,255,0.03);
                border-radius: 50%; pointer-events: auto; position: relative; border: 2px solid rgba(255,255,255,0.1);
            }
            #joystick-thumb {
                width: 44px; height: 44px; background: var(--anime-orange);
                border-radius: 50%; position: absolute; top: 33px; left: 33px; pointer-events: none;
            }
            #action-buttons-zone { display: flex; gap: 10px; }
        }

        @keyframes rotateAura { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="game-container"></div>
    <div id="flash-overlay"></div>

    <div id="hud-layer">
        <div class="hud-top-left">
            <div class="hud-character-card">
                <div class="avatar-frame">🌀</div>
                <div class="bars-container">
                    <div class="stat-bar-wrapper">
                        <span class="bar-label">VIT</span>
                        <div class="bar-track"><div id="bar-hp" class="bar-fill hp-gradient"></div></div>
                    </div>
                    <div class="stat-bar-wrapper">
                        <span class="bar-label">CHK</span>
                        <div class="bar-track"><div id="bar-chakra" class="bar-fill chakra-gradient"></div></div>
                    </div>
                    <div class="stat-bar-wrapper">
                        <span class="bar-label">STM</span>
                        <div class="bar-track"><div id="bar-stamina" class="bar-fill stamina-gradient"></div></div>
                    </div>
                </div>
            </div>
            <div id="level-indicator">RANK: <span id="rank-val">GENIN (LVL 1)</span></div>
        </div>

        <div class="hud-top-right">
            <div id="combo-box">
                <div id="combo-count">0</div>
                <div id="combo-label">RENGEKI</div>
            </div>
            <div id="score-box">SCORE: <span id="score-val">0</span></div>
        </div>

        <div id="mobile-controls">
            <div id="joystick-zone">
                <div id="joystick-thumb"></div>
            </div>
            <div id="action-buttons-zone">
                <button class="m-btn" id="m-attack">ATK</button>
                <button class="m-btn" id="m-jutsu">JUTSU</button>
                <button class="m-btn" id="m-dodge">DASH</button>
            </div>
        </div>
    </div>

    <div id="screen-overlay" class="overlay-visible">
        <div class="menu-content">
            <h1 class="glow-title">SHADOW OF THE SHINOBI</h1>
            <p class="menu-sub">ADVANCED WEBGL ANIME ENGINE</p>
            <hr class="accent-line">
            
            <div class="menu-actions">
                <button class="menu-btn primary-glow" id="start-mission-btn">COMMENCE MISSION</button>
                <button class="menu-btn" id="open-settings-btn">ENGINE SETTINGS</button>
            </div>

            <div class="control-legend">
                <p><strong>[W, A, S, D]</strong> Run Around | <strong>[Shift]</strong> Sprint Dash</p>
                <p><strong>[Left Click / J]</strong> Taijutsu Combo | <strong>[Spacebar]</strong> Jump | <strong>[E]</strong> Rasendan Blast</p>
            </div>
        </div>
    </div>

    <div id="settings-modal" class="modal-hidden">
        <div class="modal-content">
            <h2>ENGINE CONFIGURATION</h2>
            <div class="setting-row">
                <label>POST-PROCESSING BLOOM</label>
                <input type="checkbox" id="setting-bloom" checked>
            </div>
            <div class="setting-row">
                <label>DYNAMIC ENVIRONMENT FX</label>
                <input type="checkbox" id="setting-fx" checked>
            </div>
            <button class="menu-btn" id="close-settings-btn">SAVE & CLOSE</button>
        </div>
    </div>

    <script>
        window.EngineContext = null;

        // --- EXPLICIT BUTTON MOUNTING INTERCEPTOR ---
        const GameUI = {
            handleStart: () => {
                document.getElementById('screen-overlay').classList.add('overlay-hidden');
                document.getElementById('hud-layer').style.opacity = '1';
                
                // LAZY INITIALIZATION RUNS HERE (Safeguards menu interface click routines)
                if (!window.EngineContext) {
                    window.EngineContext = new Engine();
                }
                window.EngineContext.bootSequence();
            },
            toggleSettings: (open) => {
                document.getElementById('settings-modal').className = open ? '' : 'modal-hidden';
            },
            showGameOver: (score) => {
                const overlay = document.getElementById('screen-overlay');
                document.querySelector('.glow-title').innerText = "MISSION FAILED";
                document.querySelector('.glow-title').style.color = "#ff2a5f";
                document.querySelector('.menu-sub').innerText = `FINAL SCORE: ${score} SHINOBI BOUNTIES COLLECTED`;
                document.querySelector('.menu-actions').innerHTML = `<button class="menu-btn primary-glow" onclick="window.location.reload()">RE-ENTER ARENA</button>`;
                overlay.classList.remove('overlay-hidden');
                document.getElementById('hud-layer').style.opacity = '0';
            }
        };

        // Standard Event Mapping Framework
        window.addEventListener("load", () => {
            const startBtn = document.getElementById('start-mission-btn');
            const openSettingsBtn = document.getElementById('open-settings-btn');
            const closeSettingsBtn = document.getElementById('close-settings-btn');

            if(startBtn) {
                startBtn.onclick = (e) => { e.preventDefault(); GameUI.handleStart(); };
            }
            if(openSettingsBtn) {
                openSettingsBtn.onclick = (e) => { e.preventDefault(); GameUI.toggleSettings(true); };
            }
            if(closeSettingsBtn) {
                closeSettingsBtn.onclick = (e) => { e.preventDefault(); GameUI.toggleSettings(false); };
            }
        });

        class InputManager {
            constructor() {
                this.keys = { w: false, a: false, s: false, d: false, shift: false, space: false, e: false, j: false };
                this.mouse = { x: 0, y: 0 };
                this.joystick = { active: false, startX: 0, startY: 0, vector: new THREE.Vector2() };
                
                this.initKeyboardListeners();
                this.initMouseListeners();
                this.initTouchListeners();
            }

            initKeyboardListeners() {
                window.addEventListener('keydown', (e) => this.setKey(e, true));
                window.addEventListener('keyup', (e) => this.setKey(e, false));
            }

            setKey(event, isPressed) {
                const keyMap = {
                    'KeyW': 'w', 'ArrowUp': 'w',
                    'KeyA': 'a', 'ArrowLeft': 'a',
                    'KeyS': 's', 'ArrowDown': 's',
                    'KeyD': 'd', 'ArrowRight': 'd',
                    'ShiftLeft': 'shift', 'ShiftRight': 'shift',
                    'Space': 'space',
                    'KeyE': 'e',
                    'KeyJ': 'j'
                };
                const action = keyMap[event.code];
                if (action) {
                    this.keys[action] = isPressed;
                    if (event.code === 'Space') event.preventDefault();
                }
            }

            initMouseListeners() {
                window.addEventListener('mousemove', (e) => {
                    this.mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
                    this.mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
                });
                window.addEventListener('mousedown', (e) => { if(e.button === 0) this.keys.j = true; });
                window.addEventListener('mouseup', (e) => { if(e.button === 0) this.keys.j = false; });
            }

            initTouchListeners() {
                const zone = document.getElementById('joystick-zone');
                if(!zone) return;

                zone.addEventListener('touchstart', (e) => {
                    const touch = e.touches[0];
                    this.joystick.active = true;
                    this.joystick.startX = touch.clientX;
                    this.joystick.startY = touch.clientY;
                }, {passive: true});

                window.addEventListener('touchmove', (e) => {
                    if (!this.joystick.active) return;
                    const touch = e.touches[0];
                    let dx = touch.clientX - this.joystick.startX;
                    let dy = touch.clientY - this.joystick.startY;
                    
                    const maxDist = 40;
                    const dist = Math.hypot(dx, dy);
                    if (dist > maxDist) {
                        dx = (dx / dist) * maxDist;
                        dy = (dy / dist) * maxDist;
                    }

                    const thumb = document.getElementById('joystick-thumb');
                    if(thumb) thumb.style.transform = `translate(${dx}px, ${dy}px)`;
                    this.joystick.vector.set(dx / maxDist, -(dy / maxDist));
                }, {passive: true});

                window.addEventListener('touchend', () => {
                    if (!this.joystick.active) return;
                    this.joystick.active = false;
                    this.joystick.vector.set(0, 0);
                    const thumb = document.getElementById('joystick-thumb');
                    if(thumb) thumb.style.transform = `translate(0px, 0px)`;
                });

                const bindTouchTrigger = (elemId, targetAction) => {
                    const btn = document.getElementById(elemId);
                    if(btn) {
                        btn.addEventListener('touchstart', (e) => { e.preventDefault(); this.keys[targetAction] = true; });
                        btn.addEventListener('touchend', (e) => { e.preventDefault(); this.keys[targetAction] = false; });
                    }
                };

                bindTouchTrigger('m-attack', 'j');
                bindTouchTrigger('m-jutsu', 'e');
                bindTouchTrigger('m-dodge', 'shift');
            }

            getMovementVector() {
                let move = new THREE.Vector3();
                if (this.joystick.active) {
                    move.x = this.joystick.vector.x;
                    move.z = -this.joystick.vector.y;
                    return move;
                }
                if (this.keys.w) move.z -= 1;
                if (this.keys.s) move.z += 1;
                if (this.keys.a) move.x -= 1;
                if (this.keys.d) move.x += 1;
                return move.normalize();
            }
        }

        class FXManager {
            constructor(scene, camera) {
                this.scene = scene;
                this.camera = camera;
                this.particles = [];
                this.shakeIntensity = 0;
                this.shakeDecay = 0;
            }

            static createToonMaterial(baseColor, emissiveColor = 0x000000, emissiveIntensity = 0) {
                return new THREE.MeshStandardMaterial({
                    color: baseColor,
                    roughness: 0.5,
                    metalness: 0.2,
                    emissive: emissiveColor,
                    emissiveIntensity: emissiveIntensity,
                    flatShading: true
                });
            }

            triggerScreenShake(intensity, duration) {
                this.shakeIntensity = intensity;
                this.shakeDecay = intensity / duration;
            }

            spawnChakraSparks(position, colorHex, count = 15) {
                const pGeo = new THREE.SphereGeometry(0.1, 4, 4);
                const pMat = new THREE.MeshBasicMaterial({
                    color: colorHex,
                    transparent: true,
                    blending: THREE.AdditiveBlending
                });

                for (let i = 0; i < count; i++) {
                    const m = new THREE.Mesh(pGeo, pMat.clone());
                    m.position.copy(position);
                    m.userData = {
                        velocity: new THREE.Vector3(
                            (Math.random() - 0.5) * 14,
                            (Math.random() * 8) + 3,
                            (Math.random() - 0.5) * 14
                        ),
                        life: 0.3 + Math.random() * 0.4
                    };
                    this.particles.push(m);
                    this.scene.add(m);
                }
            }

            spawnEnergyTrail(origin, destination, colorHex) {
                const points = [origin, destination];
                const lineGeo = new THREE.BufferGeometry().setFromPoints(points);
                const lineMat = new THREE.LineBasicMaterial({ 
                    color: colorHex, 
                    linewidth: 5, 
                    transparent: true, 
                    opacity: 1 
                });
                const line = new THREE.Line(lineGeo, lineMat);
                this.scene.add(line);

                setTimeout(() => {
                    let fade = setInterval(() => {
                        line.material.opacity -= 0.2;
                        if(line.material.opacity <= 0) {
                            clearInterval(fade);
                            this.scene.remove(line);
                            line.geometry.dispose();
                            line.material.dispose();
                        }
                    }, 30);
                }, 40);
            }

            update(delta) {
                if (this.shakeIntensity > 0) {
                    this.camera.position.x += (Math.random() - 0.5) * this.shakeIntensity;
                    this.camera.position.y += (Math.random() - 0.5) * this.shakeIntensity;
                    this.shakeIntensity -= this.shakeDecay * delta;
                }

                for (let i = this.particles.length - 1; i >= 0; i--) {
                    const p = this.particles[i];
                    p.position.addScaledVector(p.userData.velocity, delta);
                    p.userData.velocity.y -= 12 * delta; 
                    p.userData.life -= delta;
                    p.material.opacity = Math.max(0, p.userData.life);

                    if (p.userData.life <= 0) {
                        this.scene.remove(p);
                        this.particles.splice(i, 1);
                    }
                }
            }
        }

        class Player {
            constructor(scene, fxManager) {
                this.scene = scene;
                this.fx = fxManager;
                
                this.hp = 100;
                this.chakra = 100;
                this.stamina = 100;
                this.score = 0;
                this.comboCount = 0;
                this.comboTimer = 0;
                
                this.velocity = new THREE.Vector3();
                this.isGrounded = true;
                this.isDashing = false;
                this.attackCooldown = 0;
                this.jutsuCooldown = 0;
                
                this.buildMesh();
            }

            buildMesh() {
                this.mesh = new THREE.Group();
                
                const bodyGeo = new THREE.CapsuleGeometry(0.5, 1.4, 4, 12);
                const bodyMat = FXManager.createToonMaterial(0xff5500, 0xff3300, 0.2);
                const body = new THREE.Mesh(bodyGeo, bodyMat);
                body.position.y = 1.2;
                body.castShadow = true;
                this.mesh.add(body);

                const headBandGeo = new THREE.BoxGeometry(0.65, 0.15, 0.45);
                const headBandMat = new THREE.MeshBasicMaterial({ color: 0x111624 });
                const headband = new THREE.Mesh(headBandGeo, headBandMat);
                headband.position.set(0, 1.75, -0.2);
                this.mesh.add(headband);

                this.scene.add(this.mesh);
            }

            update(delta, input) {
                if (this.comboTimer > 0) {
                    this.comboTimer -= delta;
                    if (this.comboTimer <= 0) this.resetCombo();
                }
                if (this.attackCooldown > 0) this.attackCooldown -= delta;
                if (this.jutsuCooldown > 0) this.jutsuCooldown -= delta;

                if (this.stamina < 100) this.stamina = Math.min(100, this.stamina + 25 * delta);
                if (this.chakra < 100) this.chakra = Math.min(100, this.chakra + 10 * delta);

                this.handleCombatInput(input);
                this.handleMovement(delta, input);
            }

            handleMovement(delta, input) {
                let move = input.getMovementVector();
                let currentSpeed = input.keys.shift && this.stamina > 20 && move.lengthSq() > 0 ? 15 : 8;

                if (currentSpeed === 15 && this.isGrounded) {
                    this.stamina -= 40 * delta;
                    this.fx.spawnChakraSparks(this.mesh.position, 0xffffff, 1);
                }

                this.velocity.x = move.x * currentSpeed;
                this.velocity.z = move.z * currentSpeed;

                if (!this.isGrounded) {
                    this.velocity.y -= 32 * delta; 
                } else {
                    this.velocity.y = 0;
                    if (input.keys.space) {
                        this.velocity.y = 14; 
                        this.isGrounded = false;
                        this.fx.spawnChakraSparks(this.mesh.position, 0x00dfff, 10);
                    }
                }

                this.mesh.position.addScaledVector(this.velocity, delta);

                if (this.mesh.position.y <= 0) {
                    this.mesh.position.y = 0;
                    this.isGrounded = true;
                }

                if (move.lengthSq() > 0) {
                    const targetAngle = Math.atan2(move.x, move.z);
                    const targetQuat = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), targetAngle + Math.PI);
                    this.mesh.quaternion.slerp(targetQuat, 0.2);
                }
            }

            handleCombatInput(input) {
                if (input.keys.j && this.attackCooldown <= 0) {
                    this.executeMeleeStrike();
                }
                if (input.keys.e && this.jutsuCooldown <= 0 && this.chakra >= 25) {
                    this.executeNinjutsuStrike();
                }
            }

            executeMeleeStrike() {
                this.attackCooldown = 0.2;
                this.comboCount++;
                this.comboTimer = 1.5;
                
                document.getElementById('flash-overlay').style.opacity = '0.1';
                setTimeout(() => document.getElementById('flash-overlay').style.opacity = '0', 30);

                this.fx.triggerScreenShake(0.15, 0.08);
                
                const attackOrigin = this.mesh.position.clone();
                const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(this.mesh.quaternion).normalize();
                const strikePoint = attackOrigin.clone().addScaledVector(forward, 2.2);

                this.fx.spawnEnergyTrail(attackOrigin.clone().add(new THREE.Vector3(0,1,0)), strikePoint.clone().add(new THREE.Vector3(0,1,0)), 0xff6b00);
                this.fx.spawnChakraSparks(strikePoint, 0xffaa00, 6);

                window.EngineContext.enemies.registerStrikeCheck(strikePoint, 2.8, 12);
                UI.incrementCombo(this.comboCount);
            }

            executeNinjutsuStrike() {
                this.chakra -= 25;
                this.jutsuCooldown = 0.6;
                
                this.fx.triggerScreenShake(0.5, 0.15);
                const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(this.mesh.quaternion).normalize();
                
                const flash = document.getElementById('flash-overlay');
                flash.style.background = '#00dfff';
                flash.style.opacity = '0.3';
                setTimeout(() => { flash.style.opacity = '0'; flash.style.background = 'white'; }, 100);

                this.fx.spawnChakraSparks(this.mesh.position, 0x00dfff, 25);
                
                const blastEnd = this.mesh.position.clone().addScaledVector(forward, 18);
                this.fx.spawnEnergyTrail(this.mesh.position.clone().add(new THREE.Vector3(0,1,0)), blastEnd.clone().add(new THREE.Vector3(0,1,0)), 0x00dfff);

                window.EngineContext.enemies.registerLineStrikeCheck(this.mesh.position, blastEnd, 3.0, 35);
            }

            takeDamage(amount) {
                this.hp = Math.max(0, this.hp - amount);
                this.fx.triggerScreenShake(0.6, 0.25);
                this.fx.spawnChakraSparks(this.mesh.position, 0xff0044, 15);
                
                if(this.hp <= 0) {
                    window.EngineContext.terminateGame();
                }
            }

            resetCombo() { this.comboCount = 0; UI.hideCombo(); }
        }

        class EnemyDirector {
            constructor(scene, fxManager) {
                this.scene = scene;
                this.fx = fxManager;
                this.pool = [];
                this.spawnTimer = 0;
            }

            spawn() {
                const angle = Math.random() * Math.PI * 2;
                const radius = 20 + Math.random() * 10;
                const spawnX = window.EngineContext.player.mesh.position.x + Math.cos(angle) * radius;
                const spawnZ = window.EngineContext.player.mesh.position.z + Math.sin(angle) * radius;

                const container = new THREE.Group();
                const geo = new THREE.BoxGeometry(1, 2, 1);
                const mat = FXManager.createToonMaterial(0x1a1a24, 0xff0044, 0.1);
                const mesh = new THREE.Mesh(geo, mat);
                mesh.position.y = 1;
                mesh.castShadow = true;
                container.add(mesh);

                const eyeGeo = new THREE.BoxGeometry(0.7, 0.1, 0.1);
                const eyeMat = new THREE.MeshBasicMaterial({ color: 0xff0044 });
                const eyes = new THREE.Mesh(eyeGeo, eyeMat);
                eyes.position.set(0, 1.5, -0.51);
                container.add(eyes);

                container.position.set(spawnX, 0, spawnZ);
                this.scene.add(container);

                this.pool.push({
                    mesh: container,
                    hp: 24,
                    speed: 4.0 + Math.random() * 2,
                    attackRange: 1.6,
                    cooldown: 0
                });
            }

            update(delta, playerPos) {
                this.spawnTimer += delta;
                if (this.spawnTimer >= 1.2 && this.pool.length < 15) {
                    this.spawn();
                    this.spawnTimer = 0;
                }

                for (let i = this.pool.length - 1; i >= 0; i--) {
                    const e = this.pool[i];
                    const distance = e.mesh.position.distanceTo(playerPos);
                    const dir = new THREE.Vector3().subVectors(playerPos, e.mesh.position);
                    dir.y = 0;
                    dir.normalize();

                    e.mesh.lookAt(playerPos.x, e.mesh.position.y, playerPos.z);

                    if (distance > e.attackRange) {
                        e.mesh.position.addScaledVector(dir, e.speed * delta);
                    } else {
                        if (e.cooldown <= 0) {
                            e.cooldown = 1.2; 
                            window.EngineContext.player.takeDamage(8);
                        }
                    }
                    if (e.cooldown > 0) e.cooldown -= delta;
                }
            }

            registerStrikeCheck(point, radius, damage) {
                for (let i = this.pool.length - 1; i >= 0; i--) {
                    const e = this.pool[i];
                    if (e.mesh.position.distanceTo(point) <= radius) {
                        e.hp -= damage;
                        this.fx.spawnChakraSparks(e.mesh.position, 0xff0022, 5);
                        if (e.hp <= 0) this.executeDeath(e, i);
                    }
                }
            }

            registerLineStrikeCheck(start, end, maxRadius, damage) {
                const line = new THREE.Line3(start, end);
                const closestPoint = new THREE.Vector3();

                for (let i = this.pool.length - 1; i >= 0; i--) {
                    const e = this.pool[i];
                    line.closestPointToPoint(e.mesh.position, true, closestPoint);
                    if (e.mesh.position.distanceTo(closestPoint) <= maxRadius) {
                        e.hp -= damage;
                        if (e.hp <= 0) this.executeDeath(e, i);
                    }
                }
            }

            executeDeath(enemy, index) {
                this.fx.spawnChakraSparks(enemy.mesh.position, 0x1a1a24, 15);
                this.scene.remove(enemy.mesh);
                this.pool.splice(index, 1);
                window.EngineContext.player.score += 100;
            }

            clearAll() {
                this.pool.forEach(e => this.scene.remove(e.mesh));
                this.pool = [];
            }
        }

        class UI {
            static updateHUD(player) {
                document.getElementById('bar-hp').style.width = `${player.hp}%`;
                document.getElementById('bar-chakra').style.width = `${player.chakra}%`;
                document.getElementById('bar-stamina').style.width = `${player.stamina}%`;
                document.getElementById('score-val').innerText = player.score;
            }

            static incrementCombo(count) {
                const box = document.getElementById('combo-box');
                box.style.display = 'block';
                document.getElementById('combo-count').innerText = count;
            }

            static hideCombo() {
                document.getElementById('combo-box').style.display = 'none';
            }
        }

        class Engine {
            constructor() {
                this.container = document.getElementById('game-container');
                this.clock = new THREE.Clock();
                this.isActive = false;

                this.initWebGL();
                this.initEnvironment();
                
                this.input = new InputManager();
                this.fx = new FXManager(this.scene, this.camera);
                this.player = new Player(this.scene, this.fx);
                this.enemies = new EnemyDirector(this.scene, this.fx);

                window.addEventListener('resize', () => this.handleResize());
            }

            initWebGL() {
                this.scene = new THREE.Scene();
                this.scene.background = new THREE.Color(0x04060a);
                this.scene.fog = new THREE.FogExp2(0x04060a, 0.015);

                this.camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
                
                this.renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
                this.renderer.setSize(window.innerWidth, window.innerHeight);
                this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
                this.renderer.shadowMap.enabled = true;
                this.renderer.shadowMap.type = THREE.PCFSoftShadowMap;
                this.renderer.toneMapping = THREE.ACESFilmicToneMapping;
                this.renderer.toneMappingExposure = 1.1;
                this.container.appendChild(this.renderer.domElement);

                // --- PIPELINE FAIL-SAFE RECOVERY LINK ---
                // If the post-processing scripts are blocked, fallback smoothly to standard rendering context.
                try {
                    const renderPass = new THREE.RenderPass(this.scene, this.camera);
                    const bloomPass = new THREE.UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.4, 0.4, 0.8);
                    
                    this.composer = new THREE.EffectComposer(this.renderer);
                    this.composer.addPass(renderPass);
                    this.composer.addPass(bloomPass);
                    this.useComposer = true;
                } catch(e) {
                    console.warn("Post-processing blocked or unavailable. Falling back to default WebGL Pipeline.");
                    this.useComposer = false;
                }
            }

            initEnvironment() {
                const hemiLight = new THREE.HemisphereLight(0x243454, 0x0a0f1d, 0.6);
                this.scene.add(hemiLight);

                const sunLight = new THREE.DirectionalLight(0xffaa66, 1.2);
                sunLight.position.set(30, 50, 20);
                sunLight.castShadow = true;
                this.scene.add(sunLight);

                const floorGeo = new THREE.PlaneGeometry(400, 400);
                const floorMat = new THREE.MeshStandardMaterial({ color: 0x070a12, roughness: 0.3, metalness: 0.8 });
                const floor = new THREE.Mesh(floorGeo, floorMat);
                floor.rotation.x = -Math.PI / 2;
                floor.receiveShadow = true;
                this.scene.add(floor);

                const arenaGrid = new THREE.GridHelper(400, 80, 0xff6b00, 0x101826);
                arenaGrid.position.y = 0.01;
                arenaGrid.material.opacity = 0.2;
                arenaGrid.material.transparent = true;
                this.scene.add(arenaGrid);
            }

            bootSequence() {
                this.isActive = true;
                this.clock.getDelta(); 
                this.runLoop();
            }

            runLoop() {
                if (!this.isActive) return;
                requestAnimationFrame(() => this.runLoop());

                const delta = Math.min(this.clock.getDelta(), 0.1);

                this.player.update(delta, this.input);
                this.enemies.update(delta, this.player.mesh.position);
                this.fx.update(delta);

                this.updateCamera();
                UI.updateHUD(this.player);

                if (this.useComposer && this.composer) {
                    this.composer.render();
                } else {
                    this.renderer.render(this.scene, this.camera);
                }
            }

            updateCamera() {
                const idealOffset = new THREE.Vector3(0, 14, 20).applyQuaternion(this.player.mesh.quaternion);
                const targetCamPos = this.player.mesh.position.clone().add(idealOffset);
                
                this.camera.position.lerp(targetCamPos, 0.08);
                this.camera.lookAt(this.player.mesh.position.clone().add(new THREE.Vector3(0, 1.5, 0)));
            }

            terminateGame() {
                this.isActive = false;
                GameUI.showGameOver(this.player.score);
                this.enemies.clearAll();
            }

            handleResize() {
                this.camera.aspect = window.innerWidth / window.innerHeight;
                this.camera.updateProjectionMatrix();
                this.renderer.setSize(window.innerWidth, window.innerHeight);
                if (this.useComposer && this.composer) {
                    this.composer.setSize(window.innerWidth, window.innerHeight);
                }
            }
        }
    </script>
</body>
