<html lang="en">
<head>
    <meta charset="UTF-8">

    <style>
        :root {
            --anime-orange: #ff6b00;
            --chakra-blue: #00dfff;
            --hp-red: #ff2a5f;
            --stamina-green: #2ae876;
            --dark-bg: rgba(6, 10, 18, 0.85);
            --border-glow: rgba(255, 107, 0, 0.4);
        }

        body, html {
            margin: 0; padding: 0; overflow: hidden;
            width: 100%; height: 100%;
            background-color: #030508;
            font-family: 'Segoe UI', system-ui, sans-serif;
            user-select: none; -webkit-user-select: none;
        }

        #game-container {
            width: 100%; height: 100%; position: absolute; z-index: 1;
        }

        #flash-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: white; opacity: 0; pointer-events: none; z-index: 5;
            transition: opacity 0.1s ease-out;
        }

        /* Glassmorphic UI HUD Architecture */
        #hud-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 10; pointer-events: none;
            display: flex; flex-direction: column; justify-content: space-between;
            padding: 25px; box-sizing: border-box;
        }

        .hud-top-left { display: flex; flex-direction: column; gap: 10px; }

        .hud-character-card {
            background: var(--dark-bg); backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.08); border-left: 5px solid var(--anime-orange);
            padding: 12px 20px; border-radius: 4px; display: flex; align-items: center; gap: 15px;
            pointer-events: auto; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .avatar-frame {
            font-size: 28px; background: rgba(255,255,255,0.05);
            width: 50px; height: 50px; display: flex; align-items: center;
            justify-content: center; border-radius: 50%; border: 1px solid var(--chakra-blue);
            animation: rotateAura 6s linear infinite;
        }

        .bars-container { display: flex; flex-direction: column; gap: 6px; }
        .stat-bar-wrapper { display: flex; align-items: center; gap: 10px; }
        .bar-label { font-size: 11px; font-weight: 900; color: #fff; width: 30px; letter-spacing: 1px; }

        .bar-track {
            width: 220px; height: 10px; background: rgba(0,0,0,0.6);
            border-radius: 5px; overflow: hidden; border: 1px solid rgba(255,255,255,0.05);
        }

        .bar-fill { height: 100%; width: 100%; transition: width 0.15s cubic-bezier(0.1, 0.8, 0.3, 1); }
        .hp-gradient { background: linear-gradient(90deg, #b0002a, var(--hp-red)); box-shadow: 0 0 8px var(--hp-red); }
        .chakra-gradient { background: linear-gradient(90deg, #0066cc, var(--chakra-blue)); box-shadow: 0 0 8px var(--chakra-blue); }
        .stamina-gradient { background: linear-gradient(90deg, #169e49, var(--stamina-green)); box-shadow: 0 0 8px var(--stamina-green); }

        #level-indicator {
            color: #fff; font-size: 12px; font-weight: 800; letter-spacing: 2px;
            background: rgba(0,0,0,0.4); padding: 4px 10px; width: fit-content; border-radius: 3px;
        }

        /* Combo Counter HUD element */
        .hud-top-right { display: flex; flex-direction: column; align-items: flex-end; gap: 10px; }

        #combo-box {
            text-align: right; display: none;
        }
        #combo-count {
            font-size: 64px; font-weight: 900; color: #fff; line-height: 1;
            text-shadow: 0 0 20px var(--anime-orange), 0 0 40px #ff0000;
            font-style: italic;
        }
        #combo-label { font-size: 14px; font-weight: 800; color: var(--anime-orange); letter-spacing: 4px; }

        #score-box {
            background: var(--dark-bg); color: #fff; font-weight: 800; padding: 8px 16px;
            border-radius: 4px; border: 1px solid rgba(255,255,255,0.05); letter-spacing: 1.5px;
        }

        /* UI Screen Overlays */
        .overlay-visible {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, #101624 0%, #030509 100%);
            z-index: 100; display: flex; justify-content: center; align-items: center;
            transition: opacity 0.4s ease, transform 0.4s ease; opacity: 1;
        }
        .overlay-hidden { opacity: 0; pointer-events: none; transform: scale(1.05); }

        .menu-content { text-align: center; max-width: 600px; padding: 40px; }
        .glow-title {
            font-size: 56px; font-weight: 900; color: #fff; margin: 0;
            letter-spacing: 6px; text-shadow: 0 0 30px var(--border-glow);
        }
        .menu-sub { color: var(--chakra-blue); letter-spacing: 4px; font-size: 14px; margin-top: 5px; }
        .accent-line { border: none; height: 2px; background: linear-gradient(90deg, transparent, var(--anime-orange), transparent); margin: 30px 0; }

        .menu-actions { display: flex; flex-direction: column; gap: 15px; align-items: center; }

        .menu-btn {
            background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1);
            color: #fff; width: 280px; padding: 14px; font-size: 14px; font-weight: 700;
            letter-spacing: 3px; border-radius: 4px; cursor: pointer; pointer-events: auto;
            transition: all 0.25s ease;
        }
        .menu-btn:hover {
            background: rgba(255, 107, 0, 0.1); border-color: var(--anime-orange);
            box-shadow: 0 0 20px var(--border-glow); transform: translateY(-2px);
        }
        .primary-glow { background: var(--anime-orange); color: #000; border: none; font-weight: 800; }
        .primary-glow:hover { background: #ff8533; color: #000; box-shadow: 0 0 30px rgba(255,107,0,0.6); }

        .control-legend { margin-top: 25px; font-size: 12px; color: #5c6982; line-height: 1.6; }

        /* Settings CSS Modal rules */
        .modal-hidden { display: none !important; }
        #settings-modal {
            position: absolute; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85);
            z-index: 200; display:flex; justify-content:center; align-items:center;
        }
        .modal-content {
            background: #0d131f; border: 1px solid rgba(255,255,255,0.1); padding: 40px;
            border-radius: 6px; width: 360px; text-align: center;
        }
        .modal-content h2 { font-size: 18px; letter-spacing: 2px; color: #fff; margin-bottom: 30px; }
        .setting-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; color: #a2afc7; font-size: 13px; font-weight: 600; }

        /* Responsive Mobile Layout Rules */
        #mobile-controls { display: none; width: 100%; pointer-events: none; }

        @media (max-width: 900px) {
            #mobile-controls { display: flex; justify-content: space-between; align-items: flex-end; pointer-events: none; }
            .m-btn {
                pointer-events: auto; width: 65px; height: 65px; border-radius: 50%;
                background: rgba(0,0,0,0.6); border: 2px solid rgba(255,255,255,0.2);
                color: white; font-weight: 900; font-size: 12px; margin-left: 10px;
            }
            #joystick-zone {
                width: 130px; height: 130px; background: rgba(255,255,255,0.05);
                border-radius: 50%; pointer-events: auto; position: relative; border: 2px solid rgba(255,255,255,0.1);
            }
            #joystick-thumb {
                width: 50px; height: 50px; background: var(--anime-orange);
                border-radius: 50%; position: absolute; top: 40px; left: 40px;
            }
            #action-buttons-zone { display: flex; gap: 15px; }
        }

        @keyframes rotateAura { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    </style>
</head>

    <script>
        // Global system execution hooks
        window.EngineContext = null;

        class InputManager {
            constructor() {
                this.keys = { w: false, a: false, s: false, d: false, shift: false, space: false, e: false, j: false };
                this.mouse = { x: 0, y: 0, down: false };
                this.joystick = { active: false, startX: 0, startY: 0, vector: new THREE.Vector2() };
                
                this.initKeyboardListeners();
                this.initMouseListeners();
                this.initTouchListeners();
            }

            initKeyboardListeners() {
                window.addEventListener('keydown', (e) => this.setKey(e, true));
                window.addEventListener('keyup', (e) => this.setKey(e, false));
            }

            setKey(event, isPressed) {
                const keyMap = {
                    'KeyW': 'w', 'ArrowUp': 'w',
                    'KeyA': 'a', 'ArrowLeft': 'a',
                    'KeyS': 's', 'ArrowDown': 's',
                    'KeyD': 'd', 'ArrowRight': 'd',
                    'ShiftLeft': 'shift', 'ShiftRight': 'shift',
                    'Space': 'space',
                    'KeyE': 'e',
                    'KeyJ': 'j'
                };
                const action = keyMap[event.code];
                if (action) {
                    this.keys[action] = isPressed;
                    if (event.code === 'Space') event.preventDefault();
                }
            }

            initMouseListeners() {
                window.addEventListener('mousemove', (e) => {
                    this.mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
                    this.mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
                });
                window.addEventListener('mousedown', (e) => { if(e.button === 0) this.keys.j = true; });
                window.addEventListener('mouseup', (e) => { if(e.button === 0) this.keys.j = false; });
            }

            initTouchListeners() {
                const zone = document.getElementById('joystick-zone');
                if(!zone) return;

                zone.addEventListener('touchstart', (e) => {
                    const touch = e.touches[0];
                    this.joystick.active = true;
                    this.joystick.startX = touch.clientX;
                    this.joystick.startY = touch.clientY;
                }, {passive: true});

                window.addEventListener('touchmove', (e) => {
                    if (!this.joystick.active) return;
                    const touch = e.touches[0];
                    let dx = touch.clientX - this.joystick.startX;
                    let dy = touch.clientY - this.joystick.startY;
                    
                    const maxDist = 40;
                    const dist = Math.hypot(dx, dy);
                    if (dist > maxDist) {
                        dx = (dx / dist) * maxDist;
                        dy = (dy / dist) * maxDist;
                    }

                    const thumb = document.getElementById('joystick-thumb');
                    if(thumb) thumb.style.transform = `translate(${dx}px, ${dy}px)`;
                    this.joystick.vector.set(dx / maxDist, -(dy / maxDist));
                }, {passive: true});

                window.addEventListener('touchend', () => {
                    if (!this.joystick.active) return;
                    this.joystick.active = false;
                    this.joystick.vector.set(0, 0);
                    const thumb = document.getElementById('joystick-thumb');
                    if(thumb) thumb.style.transform = `translate(0px, 0px)`;
                });

                const bindTouchTrigger = (elemId, targetAction) => {
                    const btn = document.getElementById(elemId);
                    if(btn) {
                        btn.addEventListener('touchstart', (e) => { e.preventDefault(); this.keys[targetAction] = true; });
                        btn.addEventListener('touchend', () => { this.keys[targetAction] = false; });
                    }
                };

                bindTouchTrigger('m-attack', 'j');
                bindTouchTrigger('m-jutsu', 'e');
                bindTouchTrigger('m-dodge', 'shift');
            }

            getMovementVector() {
                let move = new THREE.Vector3();
                if (this.joystick.active) {
                    move.x = this.joystick.vector.x;
                    move.z = -this.joystick.vector.y;
                    return move;
                }
                if (this.keys.w) move.z -= 1;
                if (this.keys.s) move.z += 1;
                if (this.keys.a) move.x -= 1;
                if (this.keys.d) move.x += 1;
                return move.normalize();
            }
        }

        class FXManager {
            constructor(scene, camera) {
                this.scene = scene;
                this.camera = camera;
                this.particles = [];
                this.shakeIntensity = 0;
                this.shakeDecay = 0;
            }

            static createToonMaterial(baseColor, emissiveColor = 0x000000, emissiveIntensity = 0) {
                return new THREE.MeshStandardMaterial({
                    color: baseColor,
                    roughness: 0.5,
                    metalness: 0.2,
                    emissive: emissiveColor,
                    emissiveIntensity: emissiveIntensity,
                    flatShading: true
                });
            }

            triggerScreenShake(intensity, duration) {
                this.shakeIntensity = intensity;
                this.shakeDecay = intensity / duration;
            }

            spawnChakraSparks(position, colorHex, count = 15) {
                const pGeo = new THREE.SphereGeometry(0.1, 4, 4);
                const pMat = new THREE.MeshBasicMaterial({
                    color: colorHex,
                    transparent: true,
                    blending: THREE.AdditiveBlending
                });

                for (let i = 0; i < count; i++) {
                    const m = new THREE.Mesh(pGeo, pMat.clone());
                    m.position.copy(position);
                    m.userData = {
                        velocity: new THREE.Vector3(
                            (Math.random() - 0.5) * 14,
                            (Math.random() * 8) + 3,
                            (Math.random() - 0.5) * 14
                        ),
                        life: 0.3 + Math.random() * 0.4
                    };
                    this.particles.push(m);
                    this.scene.add(m);
                }
            }

            spawnEnergyTrail(origin, destination, colorHex) {
                const points = [origin, destination];
                const lineGeo = new THREE.BufferGeometry().setFromPoints(points);
                const lineMat = new THREE.LineBasicMaterial({ 
                    color: colorHex, 
                    linewidth: 5, 
                    transparent: true, 
                    opacity: 1 
                });
                const line = new THREE.Line(lineGeo, lineMat);
                this.scene.add(line);

                setTimeout(() => {
                    let fade = setInterval(() => {
                        line.material.opacity -= 0.2;
                        if(line.material.opacity <= 0) {
                            clearInterval(fade);
                            this.scene.remove(line);
                            line.geometry.dispose();
                            line.material.dispose();
                        }
                    }, 30);
                }, 40);
            }
