<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shinobi Chronicles: Advanced WebGL Engine</title>
    <style>
        :root {
            --primary: #ff6b00;
            --secondary: #00dfff;
            --bg-glass: rgba(10, 15, 25, 0.6);
        }
        body {
            margin: 0; overflow: hidden; background: #000;
            font-family: 'Segoe UI', system-ui, sans-serif;
            user-select: none; color: white;
        }
        #canvas-container { width: 100vw; height: 100vh; position: absolute; z-index: 1; }
        
        /* Modern Glassmorphism UI */
        #ui-layer {
            position: absolute; z-index: 10; width: 100%; height: 100%;
            pointer-events: none; padding: 30px; box-sizing: border-box;
            display: flex; flex-direction: column; justify-content: space-between;
        }
        .hud-container { display: flex; gap: 30px; }
        .hud-panel {
            background: var(--bg-glass);
            backdrop-filter: blur(10px);
            border-left: 4px solid var(--primary);
            padding: 15px 25px;
            border-radius: 4px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }
        .hud-panel h3 { margin: 0 0 10px 0; font-size: 14px; letter-spacing: 2px; color: #aaa; }
        .bar-wrap { width: 250px; height: 12px; background: rgba(0,0,0,0.5); border-radius: 6px; overflow: hidden; }
        .bar-fill { height: 100%; transition: width 0.1s linear; }
        #hp-fill { background: linear-gradient(90deg, #ff0044, #ff5555); width: 100%; }
        #cp-fill { background: linear-gradient(90deg, #0088ff, var(--secondary)); width: 100%; }
        
        #score-panel { border-left-color: #ffd700; font-size: 24px; font-weight: bold; }
        
        .instructions {
            align-self: center; background: var(--bg-glass); backdrop-filter: blur(5px);
            padding: 15px 30px; border-radius: 30px; border: 1px solid rgba(255,255,255,0.1);
            letter-spacing: 1px;
        }
        .key { background: #fff; color: #000; padding: 2px 8px; border-radius: 4px; font-weight: bold; }

        /* Game Over / Loading Screen */
        #overlay {
            position: absolute; z-index: 20; width: 100%; height: 100%;
            background: rgba(5, 8, 12, 0.9);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            transition: opacity 0.5s;
        }
        #overlay h1 { font-size: 64px; margin: 0; color: var(--primary); text-transform: uppercase; letter-spacing: 5px;}
        #overlay p { font-size: 20px; color: #ccc; margin-bottom: 40px; }
        .btn {
            background: transparent; border: 2px solid var(--primary); color: var(--primary);
            padding: 15px 40px; font-size: 18px; font-weight: bold; cursor: pointer;
            text-transform: uppercase; letter-spacing: 2px; transition: all 0.3s;
            pointer-events: auto;
        }
        .btn:hover { background: var(--primary); color: #000; box-shadow: 0 0 20px rgba(255, 107, 0, 0.5); }
    </style>
    
    <!-- Core Three.js and Loaders -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <!-- Post Processing for AAA Bloom effects -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
</head>
<body>

    <div id="overlay">
        <h1 id="title-text">Engine Initializing</h1>
        <p id="sub-text">Loading Assets...</p>
        <button class="btn" id="action-btn" style="display:none;" onclick="startGame()">Commence</button>
    </div>

    <div id="ui-layer">
        <div class="hud-container">
            <div class="hud-panel">
                <h3>VITALITY</h3>
                <div class="bar-wrap"><div id="hp-fill" class="bar-fill"></div></div>
            </div>
            <div class="hud-panel" style="border-left-color: var(--secondary);">
                <h3>CHAKRA</h3>
                <div class="bar-wrap"><div id="cp-fill" class="bar-fill"></div></div>
            </div>
            <div class="hud-panel" id="score-panel">
                KILLS: <span id="score-val">0</span>
            </div>
        </div>
        <div class="instructions">
            Movement: <span class="key">W</span> <span class="key">A</span> <span class="key">S</span> <span class="key">D</span> &nbsp;|&nbsp; Rasengan: <span class="key">SPACE</span>
        </div>
    </div>

    <div id="canvas-container"></div>

    <script>
        // --- ARCHITECTURE & STATE ---
        let scene, camera, renderer, composer;
        let player, playerMixer;
        let isLoaded = false, isPlaying = false;
        
        // Input Map
        const keys = { w: false, a: false, s: false, d: false, space: false };
        const mouse = new THREE.Vector2();
        
        // Entity Pools
        const projectiles = [];
        const enemies = [];
        const clock = new THREE.Clock();
        
        // Game Logic State
        const state = { hp: 100, cp: 100, score: 0 };
        const SPEED = 12.0; 
        const PROJECTILE_SPEED = 25.0;
        
        initEngine();

        function initEngine() {
            const container = document.getElementById('canvas-container');
            
            // 1. Scene & Environment
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x050810, 0.015);
            
            // 2. Camera Setup (Isometric tracking)
            camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 500);
            
            // 3. Renderer with PBR capabilities
            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.2;
            container.appendChild(renderer.domElement);

            // 4. Post-Processing Pipeline (The "AAA" Look)
            const renderScene = new THREE.RenderPass(scene, camera);
            const bloomPass = new THREE.UnrealBloomPass(
                new THREE.Vector2(window.innerWidth, window.innerHeight),
                1.5, // intensity
                0.4, // radius
                0.85 // threshold
            );
            composer = new THREE.EffectComposer(renderer);
            composer.addPass(renderScene);
            composer.addPass(bloomPass);

            // 5. Lighting Setup
            const hemiLight = new THREE.HemisphereLight(0x4466ff, 0x111122, 0.6);
            scene.add(hemiLight);
            
            const dirLight = new THREE.DirectionalLight(0xffddaa, 1.5);
            dirLight.position.set(50, 100, 50);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 2048;
            dirLight.shadow.mapSize.height = 2048;
            dirLight.shadow.camera.near = 0.5;
            dirLight.shadow.camera.far = 200;
            dirLight.shadow.bias = -0.001;
            const d = 50;
            dirLight.shadow.camera.left = -d; dirLight.shadow.camera.right = d;
            dirLight.shadow.camera.top = d; dirLight.shadow.camera.bottom = -d;
            scene.add(dirLight);

            // 6. Environment Design
            createArena();

            // 7. Asset Pipeline - Loading the specific GLB model
            loadPlayerModel();

            // Listeners
            window.addEventListener('resize', onWindowResize);
            document.addEventListener('keydown', (e) => handleInput(e, true));
            document.addEventListener('keyup', (e) => handleInput(e, false));
            
            animate();
        }

        function createArena() {
            // High-end PBR floor
            const floorGeo = new THREE.PlaneGeometry(300, 300);
            const floorMat = new THREE.MeshStandardMaterial({ 
                color: 0x1a1f2b, 
                roughness: 0.1, 
                metalness: 0.8 
            });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            scene.add(floor);

            // Add aesthetic neon grid mapping
            const grid = new THREE.GridHelper(300, 100, 0x00dfff, 0x111625);
            grid.position.y = 0.05;
            grid.material.transparent = true;
            grid.material.opacity = 0.3;
            scene.add(grid);
        }

        function loadPlayerModel() {
            player = new THREE.Group();
            scene.add(player);

            const loader = new THREE.GLTFLoader();
            
            // Loading the exact asset requested
            loader.load(
                'naruto_sage_mode.glb',
                function (gltf) {
                    const model = gltf.scene;
                    model.scale.set(1.5, 1.5, 1.5); // Adjust based on your model's native scale
                    model.traverse((child) => {
                        if (child.isMesh) {
                            child.castShadow = true;
                            child.receiveShadow = true;
                        }
                    });
                    player.add(model);
                    
                    // Setup animations if your GLB has them
                    if (gltf.animations && gltf.animations.length > 0) {
                        playerMixer = new THREE.AnimationMixer(model);
                        const idleAnim = playerMixer.clipAction(gltf.animations[0]); 
                        idleAnim.play();
                    }

                    readyGame();
                },
                function (xhr) {
                    const percent = Math.round((xhr.loaded / xhr.total) * 100);
                    document.getElementById('sub-text').innerText = `Loading Assets: ${percent || '...'}%`;
                },
                function (error) {
                    console.warn("GLB not found in root. Generating professional fallback mesh...");
                    generateFallbackPlayer();
                    readyGame();
                }
            );

            // Add dynamic point light to player (Chakra glow)
            const auraLight = new THREE.PointLight(0xff6b00, 1, 10);
            auraLight.position.y = 2;
            player.add(auraLight);
        }

        function generateFallbackPlayer() {
            // High-fidelity fallback if the GLB file isn't uploaded yet
            const geo = new THREE.CapsuleGeometry(0.6, 1.8, 4, 16);
            const mat = new THREE.MeshStandardMaterial({ 
                color: 0xff5500, roughness: 0.3, metalness: 0.1,
                emissive: 0xff2200, emissiveIntensity: 0.2
            });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.y = 1.5;
            mesh.castShadow = true;
            player.add(mesh);
        }

        function readyGame() {
            isLoaded = true;
            document.getElementById('title-text').innerText = "SYSTEM READY";
            document.getElementById('sub-text').innerText = "Standby for combat.";
            document.getElementById('action-btn').style.display = 'block';
        }

        function startGame() {
            if (!isLoaded) return;
            isPlaying = true;
            document.getElementById('overlay').style.opacity = 0;
            setTimeout(() => document.getElementById('overlay').style.display = 'none', 500);
            resetState();
        }

        // --- COMBAT & INPUT LOGIC ---
        function handleInput(e, isDown) {
            const k = e.key.toLowerCase();
            if (k === 'w') keys.w = isDown;
            if (k === 'a') keys.a = isDown;
            if (k === 's') keys.s = isDown;
            if (k === 'd') keys.d = isDown;
            if (e.code === 'Space') {
                if (isDown && !keys.space) executeAttack(); // Prevent holding down
                keys.space = isDown;
            }
        }

        function executeAttack() {
            if (!isPlaying || state.cp < 20) return;
            
            state.cp -= 20;
            updateHUD();

            // Create Rasengan with Bloom Material
            const geo = new THREE.SphereGeometry(0.8, 32, 32);
            const mat = new THREE.MeshStandardMaterial({
                color: 0xffffff,
                emissive: 0x00dfff,
                emissiveIntensity: 5.0, // High intensity triggers the UnrealBloomPass
                roughness: 0.0,
                transparent: true,
                opacity: 0.9
            });
            const sphere = new THREE.Mesh(geo, mat);
            
            // Calculate precise forward vector
            const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(player.quaternion).normalize();
            
            // Spawn slightly in front of player
            sphere.position.copy(player.position).add(forward.clone().multiplyScalar(2));
            sphere.position.y = 1.5; // Chest height
            
            // Attach precise bounding box for professional collision
            sphere.geometry.computeBoundingBox();
            
            scene.add(sphere);
            projectiles.push({
                mesh: sphere,
                dir: forward,
                life: 2.0 // Seconds
            });
        }

        function spawnEnemy() {
            const angle = Math.random() * Math.PI * 2;
            const radius = 30 + Math.random() * 20;
            
            // Enemy Mesh (Shadow Clones/Rogue Ninjas)
            const geo = new THREE.BoxGeometry(1.2, 2.5, 1.2);
            const mat = new THREE.MeshStandardMaterial({ 
                color: 0x222233, roughness: 0.7, 
                emissive: 0xff0000, emissiveIntensity: 0.1 
            });
            const mesh = new THREE.Mesh(geo, mat);
            
            mesh.position.set(
                player.position.x + Math.cos(angle) * radius,
                1.25,
                player.position.z + Math.sin(angle) * radius
            );
            mesh.castShadow = true;
            
            // Compute collision box
            mesh.geometry.computeBoundingBox();

            scene.add(mesh);
            enemies.push({ mesh: mesh, hp: 100 });
        }

        // --- MAIN GAME LOOP ---
        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();

            if (isPlaying) {
                if (playerMixer) playerMixer.update(delta);
                
                updatePlayer(delta);
                updateProjectiles(delta);
                updateEnemies(delta);
                
                // Regenerate Chakra
                if (state.cp < 100) {
                    state.cp = Math.min(100, state.cp + (10 * delta));
                    updateHUD();
                }

                // AI Director: Spawn logic
                if (Math.random() < 0.02 && enemies.length < 15) spawnEnemy();
            }

            // Render via Post-Processing Composer (NOT standard renderer)
            composer.render();
        }

        function updatePlayer(delta) {
            const move = new THREE.Vector3(0, 0, 0);
            if (keys.w) move.z -= 1;
            if (keys.s) move.z += 1;
            if (keys.a) move.x -= 1;
            if (keys.d) move.x += 1;

            if (move.lengthSq() > 0) {
                move.normalize();
                player.position.add(move.multiplyScalar(SPEED * delta));
                
                // Smooth rotation using slerp for professional feel
                const targetAngle = Math.atan2(move.x, move.z);
                const currentQuat = player.quaternion.clone();
                const targetQuat = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), targetAngle + Math.PI);
                player.quaternion.slerp(targetQuat, 0.15);
            }

            // Smooth Camera Rig
            const cameraTarget = new THREE.Vector3(
                player.position.x, 
                player.position.y + 12, 
                player.position.z + 15
            );
            camera.position.lerp(cameraTarget, 0.1);
            camera.lookAt(player.position.x, player.position.y + 1, player.position.z);
        }

        function updateProjectiles(delta) {
            // Backward loop to safely remove elements
            for (let i = projectiles.length - 1; i >= 0; i--) {
                const p = projectiles[i];
                p.life -= delta;
                
                if (p.life <= 0) {
                    scene.remove(p.mesh);
                    projectiles.splice(i, 1);
                    continue;
                }

                // Move projectile
                p.mesh.position.add(p.dir.clone().multiplyScalar(PROJECTILE_SPEED * delta));
                p.mesh.rotation.x += 15 * delta; // Spin effect
                
                // Advanced Collision Detection (AABB)
                const pBox = new THREE.Box3().setFromObject(p.mesh);
                let hit = false;

                for (let j = enemies.length - 1; j >= 0; j--) {
                    const e = enemies[j];
                    const eBox = new THREE.Box3().setFromObject(e.mesh);
                    
                    if (pBox.intersectsBox(eBox)) {
                        // Collision Confirmed
                        scene.remove(e.mesh);
                        enemies.splice(j, 1);
                        state.score += 1;
                        hit = true;
                        updateHUD();
                        break;
                    }
                }

                if (hit) {
                    scene.remove(p.mesh);
                    projectiles.splice(i, 1);
                }
            }
        }

        function updateEnemies(delta) {
            const playerBox = new THREE.Box3().setFromObject(player);

            for (let i = enemies.length - 1; i >= 0; i--) {
                const e = enemies[i];
                
                // Move towards player
                const dir = new THREE.Vector3().subVectors(player.position, e.mesh.position);
                dir.y = 0; 
                dir.normalize();
                
                e.mesh.position.add(dir.multiplyScalar((SPEED * 0.4) * delta));
                e.mesh.lookAt(player.position.x, e.mesh.position.y, player.position.z);

                // Check collision with player
                const eBox = new THREE.Box3().setFromObject(e.mesh);
                if (eBox.intersectsBox(playerBox)) {
                    state.hp -= 20;
                    scene.remove(e.mesh);
                    enemies.splice(i, 1);
                    updateHUD();

                    // Flash screen red effect
                    document.getElementById('hp-fill').style.background = 'white';
                    setTimeout(() => document.getElementById('hp-fill').style.background = 'linear-gradient(90deg, #ff0044, #ff5555)', 100);

                    if (state.hp <= 0) gameOver();
                }
            }
        }

        function updateHUD() {
            document.getElementById('hp-fill').style.width = `${Math.max(0, state.hp)}%`;
            document.getElementById('cp-fill').style.width = `${Math.max(0, state.cp)}%`;
            document.getElementById('score-val').innerText = state.score;
        }

        function gameOver() {
            isPlaying = false;
            document.getElementById('overlay').style.display = 'flex';
            setTimeout(() => document.getElementById('overlay').style.opacity = 1, 10);
            
            document.getElementById('title-text').innerText = "MISSION FAILED";
            document.getElementById('title-text').style.color = "#ff0044";
            document.getElementById('sub-text').innerText = `Enemies Defeated: ${state.score}`;
            document.getElementById('action-btn').innerText = "RESTART";
        }

        function resetState() {
            state.hp = 100;
            state.cp = 100;
            state.score = 0;
            
            // Clear board
            enemies.forEach(e => scene.remove(e.mesh));
            projectiles.forEach(p => scene.remove(p.mesh));
            enemies.length = 0;
            projectiles.length = 0;
            
            player.position.set(0, 0, 0);
            updateHUD();
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        }
    </script>
</body>
</html>
