<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chakra Surge: Shinobi Action</title>
    <style>
        body, html { margin: 0; padding: 0; overflow: hidden; background-color: #050508; font-family: 'Segoe UI', Tahoma, sans-serif; }
        canvas { display: block; }
        
        #ui {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none;
            display: flex; flex-direction: column; justify-content: space-between; padding: 30px; box-sizing: border-box;
        }
        .bar-container { width: 300px; height: 16px; background: rgba(0,0,0,0.6); border: 2px solid #333; border-radius: 8px; overflow: hidden; margin-bottom: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.8); }
        .bar { height: 100%; transition: width 0.1s; }
        #hp { background: linear-gradient(90deg, #ff0044, #ff4444); width: 100%; box-shadow: 0 0 10px #ff0044; }
        #cp { background: linear-gradient(90deg, #0088ff, #00dfff); width: 100%; box-shadow: 0 0 10px #00dfff; }
        
        .hud-text { color: white; font-weight: bold; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 2px; font-size: 14px; text-shadow: 1px 1px 2px black; }
        #score-display { font-size: 32px; color: #ff9900; text-shadow: 0 0 15px rgba(255, 153, 0, 0.8); }
        
        #menu {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(5,5,8,0.9);
            display: flex; flex-direction: column; justify-content: center; align-items: center; pointer-events: auto;
            transition: opacity 0.3s;
        }
        h1 { color: #ff6b00; font-size: 72px; margin: 0; letter-spacing: 10px; text-shadow: 0 0 40px rgba(255, 107, 0, 0.6); }
        p { color: #888; font-size: 18px; letter-spacing: 2px; margin-bottom: 40px; }
        .controls { background: rgba(255,255,255,0.05); padding: 20px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.1); color: #ccc; margin-bottom: 40px; text-align: center; line-height: 1.8;}
        button {
            background: transparent; border: 2px solid #ff6b00; color: #ff6b00; padding: 15px 50px; font-size: 20px; font-weight: bold;
            cursor: pointer; text-transform: uppercase; letter-spacing: 3px; border-radius: 5px; transition: 0.2s;
        }
        button:hover { background: #ff6b00; color: #000; box-shadow: 0 0 25px #ff6b00; transform: scale(1.05); }
    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>

    <div id="ui">
        <div>
            <div class="hud-text">Vitality</div>
            <div class="bar-container"><div id="hp" class="bar"></div></div>
            <div class="hud-text">Chakra (Regenerating)</div>
            <div class="bar-container"><div id="cp" class="bar"></div></div>
        </div>
        <div id="score-display">Bounties: <span id="score">0</span></div>
    </div>

    <div id="menu">
        <h1>CHAKRA SURGE</h1>
        <p>Tactical Espionage Action</p>
        <div class="controls">
            <strong>W A S D</strong> - Move<br>
            <strong>Mouse Cursor</strong> - Aim<br>
            <strong>Left Click</strong> - Shuriken Arc<br>
            <strong>Right Click / Space</strong> - Rasengan Dash (Requires Chakra)
        </div>
        <button onclick="startGame()">Commence</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        // --- GAME ENGINE STATE ---
        let gameLoop;
        let lastTime = 0;
        let shakeTime = 0;
        let hitStopTime = 0;
        let isPlaying = false;

        const mouse = { x: canvas.width / 2, y: canvas.height / 2 };
        const keys = { w: false, a: false, s: false, d: false };

        // Game Entities
        let player, projectiles, enemies, particles, floatingTexts;
        let score = 0;

        // --- CLASSES ---

        class Player {
            constructor() {
                this.x = canvas.width / 2;
                this.y = canvas.height / 2;
                this.radius = 15;
                this.speed = 400; // pixels per sec
                this.hp = 100;
                this.cp = 100;
                this.color = '#ff6b00';
                this.trail = [];
                this.dashCooldown = 0;
            }

            update(dt) {
                // Movement
                let dx = 0; let dy = 0;
                if (keys.w) dy -= 1;
                if (keys.s) dy += 1;
                if (keys.a) dx -= 1;
                if (keys.d) dx += 1;

                // Normalize diagonal movement
                if (dx !== 0 && dy !== 0) {
                    const length = Math.sqrt(dx * dx + dy * dy);
                    dx /= length; dy /= length;
                }

                this.x += dx * this.speed * dt;
                this.y += dy * this.speed * dt;

                // Boundary check
                this.x = Math.max(this.radius, Math.min(canvas.width - this.radius, this.x));
                this.y = Math.max(this.radius, Math.min(canvas.height - this.radius, this.y));

                // Trail logic
                this.trail.push({ x: this.x, y: this.y });
                if (this.trail.length > 10) this.trail.shift();

                // Regeneration
                if (this.cp < 100) this.cp += 15 * dt;
                if (this.dashCooldown > 0) this.dashCooldown -= dt;
            }

            draw(ctx) {
                // Draw trail
                if (this.trail.length > 1) {
                    ctx.beginPath();
                    ctx.moveTo(this.trail[0].x, this.trail[0].y);
                    for (let i = 1; i < this.trail.length; i++) {
                        ctx.lineTo(this.trail[i].x, this.trail[i].y);
                    }
                    ctx.strokeStyle = 'rgba(255, 107, 0, 0.3)';
                    ctx.lineWidth = this.radius * 2;
                    ctx.lineCap = 'round';
                    ctx.stroke();
                }

                // Draw player core
                ctx.save();
                ctx.translate(this.x, this.y);
                const angle = Math.atan2(mouse.y - this.y, mouse.x - this.x);
                ctx.rotate(angle);
                
                ctx.shadowBlur = 20;
                ctx.shadowColor = this.color;
                ctx.fillStyle = this.color;
                
                ctx.beginPath();
                ctx.moveTo(this.radius, 0);
                ctx.lineTo(-this.radius, this.radius * 0.8);
                ctx.lineTo(-this.radius * 0.5, 0);
                ctx.lineTo(-this.radius, -this.radius * 0.8);
                ctx.closePath();
                ctx.fill();
                
                // Core light
                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.arc(0, 0, this.radius * 0.3, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.restore();
            }

            dash() {
                if (this.cp >= 30 && this.dashCooldown <= 0) {
                    this.cp -= 30;
                    this.dashCooldown = 0.5;
                    
                    const angle = Math.atan2(mouse.y - this.y, mouse.x - this.x);
                    
                    // Burst effect
                    createExplosion(this.x, this.y, '#00dfff', 30);
                    
                    // Dash mechanics
                    const dashDist = 200;
                    this.x += Math.cos(angle) * dashDist;
                    this.y += Math.sin(angle) * dashDist;
                    
                    // Damage enemies in path
                    const dashRadius = 60;
                    enemies.forEach(e => {
                        const dist = Math.hypot(this.x - e.x, this.y - e.y);
                        if(dist < dashRadius) {
                            e.hp -= 100;
                        }
                    });

                    createExplosion(this.x, this.y, '#00dfff', 40);
                    triggerShake(15);
                    triggerHitStop(80);
                }
            }
        }

        class Projectile {
            constructor(x, y, targetX, targetY) {
                this.x = x;
                this.y = y;
                this.speed = 800;
                this.radius = 4;
                const angle = Math.atan2(targetY - y, targetX - x);
                this.vx = Math.cos(angle) * this.speed;
                this.vy = Math.sin(angle) * this.speed;
                this.color = '#00dfff';
                this.life = 1.5; // seconds
            }
            update(dt) {
                this.x += this.vx * dt;
                this.y += this.vy * dt;
                this.life -= dt;
                
                // Trail particle
                particles.push(new Particle(this.x, this.y, this.color, 2, 0.2));
            }
            draw(ctx) {
                ctx.shadowBlur = 10;
                ctx.shadowColor = this.color;
                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
            }
        }

        class Enemy {
            constructor() {
                // Spawn on edges
                const edge = Math.floor(Math.random() * 4);
                if (edge === 0) { this.x = Math.random() * canvas.width; this.y = -30; } // Top
                else if (edge === 1) { this.x = canvas.width + 30; this.y = Math.random() * canvas.height; } // Right
                else if (edge === 2) { this.x = Math.random() * canvas.width; this.y = canvas.height + 30; } // Bottom
                else { this.x = -30; this.y = Math.random() * canvas.height; } // Left

                this.radius = 14;
                this.speed = 100 + Math.random() * 80;
                this.hp = 30;
                this.color = '#ff0033';
            }
            update(dt) {
                const angle = Math.atan2(player.y - this.y, player.x - this.x);
                this.x += Math.cos(angle) * this.speed * dt;
                this.y += Math.sin(angle) * this.speed * dt;
            }
            draw(ctx) {
                ctx.shadowBlur = 15;
                ctx.shadowColor = this.color;
                ctx.fillStyle = '#222';
                ctx.strokeStyle = this.color;
                ctx.lineWidth = 3;
                
                ctx.beginPath();
                ctx.moveTo(this.x + this.radius, this.y);
                for(let i=1; i<=6; i++) {
                    const a = i * (Math.PI*2)/6;
                    ctx.lineTo(this.x + Math.cos(a)*this.radius, this.y + Math.sin(a)*this.radius);
                }
                ctx.closePath();
                ctx.fill();
                ctx.stroke();
                
                // Eye
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, 4, 0, Math.PI*2);
                ctx.fill();
                ctx.shadowBlur = 0;
            }
        }

        class Particle {
            constructor(x, y, color, size, life, speedMultiplier = 1) {
                this.x = x; this.y = y;
                this.color = color;
                this.size = size + Math.random() * size;
                this.life = life;
                this.maxLife = life;
                const angle = Math.random() * Math.PI * 2;
                const speed = (Math.random() * 200 + 50) * speedMultiplier;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.friction = 0.95;
            }
            update(dt) {
                this.vx *= this.friction;
                this.vy *= this.friction;
                this.x += this.vx * dt;
                this.y += this.vy * dt;
                this.life -= dt;
            }
            draw(ctx) {
                ctx.globalAlpha = Math.max(0, this.life / this.maxLife);
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1.0;
            }
        }

        // --- ENGINE SYSTEMS ---

        function triggerShake(intensity) { shakeTime = intensity; }
        function triggerHitStop(ms) { hitStopTime = ms; }

        function createExplosion(x, y, color, count) {
            for(let i=0; i<count; i++) {
                particles.push(new Particle(x, y, color, 3, 0.5 + Math.random()*0.5, 2));
            }
        }

        function updateUI() {
            document.getElementById('hp').style.width = `${Math.max(0, player.hp)}%`;
            document.getElementById('cp').style.width = `${Math.max(0, player.cp)}%`;
            document.getElementById('score').innerText = score;
        }

        // --- INPUT HANDLING ---
        window.addEventListener('keydown', e => {
            if (e.key.toLowerCase() === 'w') keys.w = true;
            if (e.key.toLowerCase() === 'a') keys.a = true;
            if (e.key.toLowerCase() === 's') keys.s = true;
            if (e.key.toLowerCase() === 'd') keys.d = true;
            if (e.code === 'Space' && isPlaying) player.dash();
        });

        window.addEventListener('keyup', e => {
            if (e.key.toLowerCase() === 'w') keys.w = false;
            if (e.key.toLowerCase() === 'a') keys.a = false;
            if (e.key.toLowerCase() === 's') keys.s = false;
            if (e.key.toLowerCase() === 'd') keys.d = false;
        });

        window.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
        
        window.addEventListener('mousedown', e => {
            if(!isPlaying) return;
            if (e.button === 0) { // Left click = shoot
                projectiles.push(new Projectile(player.x, player.y, mouse.x, mouse.y));
            } else if (e.button === 2) { // Right click = dash
                player.dash();
            }
        });
        window.addEventListener('contextmenu', e => e.preventDefault());

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        // --- MAIN LOOP ---
        function startGame() {
            document.getElementById('menu').style.opacity = '0';
            setTimeout(() => document.getElementById('menu').style.display = 'none', 300);
            
            player = new Player();
            projectiles = [];
            enemies = [];
            particles = [];
            score = 0;
            isPlaying = true;
            lastTime = performance.now();
            updateUI();
            
            requestAnimationFrame(update);
        }

        function gameOver() {
            isPlaying = false;
            document.getElementById('menu').style.display = 'flex';
            setTimeout(() => document.getElementById('menu').style.opacity = '1', 50);
            document.querySelector('#menu h1').innerText = "MISSION FAILED";
            document.querySelector('#menu h1').style.color = "#ff0044";
        }

        let enemySpawnTimer = 0;

        function update(currentTime) {
            if (!isPlaying) return;
            
            // Calculate Delta Time
            let dt = (currentTime - lastTime) / 1000;
            lastTime = currentTime;
            
            // Hit Stop execution (freezes logic, skips update)
            if (hitStopTime > 0) {
                hitStopTime -= dt * 1000;
                requestAnimationFrame(update);
                return;
            }

            // Cap dt to prevent physics explosions on lag
            if (dt > 0.1) dt = 0.1;

            // Update Entities
            player.update(dt);
            
            // Enemy Spawner
            enemySpawnTimer -= dt;
            if (enemySpawnTimer <= 0) {
                enemies.push(new Enemy());
                enemySpawnTimer = Math.max(0.2, 1.0 - (score * 0.01)); // gets faster
            }

            // Projectiles
            for (let i = projectiles.length - 1; i >= 0; i--) {
                const p = projectiles[i];
                p.update(dt);
                if (p.life <= 0) projectiles.splice(i, 1);
            }

            // Enemies & Collisions
            for (let i = enemies.length - 1; i >= 0; i--) {
                const e = enemies[i];
                e.update(dt);

                // Hit Player
                const distToPlayer = Math.hypot(player.x - e.x, player.y - e.y);
                if (distToPlayer < player.radius + e.radius) {
                    player.hp -= 15;
                    createExplosion(player.x, player.y, '#ff0044', 15);
                    triggerShake(10);
                    enemies.splice(i, 1);
                    updateUI();
                    if (player.hp <= 0) {
                        gameOver();
                        return;
                    }
                    continue;
                }

                // Hit by Projectile
                for (let j = projectiles.length - 1; j >= 0; j--) {
                    const p = projectiles[j];
                    const distToProj = Math.hypot(p.x - e.x, p.y - e.y);
                    if (distToProj < e.radius + p.radius) {
                        e.hp -= 34; // 3 hits to kill
                        projectiles.splice(j, 1);
                        createExplosion(p.x, p.y, '#ffffff', 5); // Sparks
                        
                        if (e.hp <= 0) {
                            createExplosion(e.x, e.y, e.color, 20);
                            enemies.splice(i, 1);
                            score++;
                            updateUI();
                            triggerShake(3);
                        }
                        break;
                    }
                }
            }

            // Particles
            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update(dt);
                if (particles[i].life <= 0) particles.splice(i, 1);
            }

            draw();
            requestAnimationFrame(update);
        }

        function draw() {
            // Screen Shake setup
            ctx.save();
            if (shakeTime > 0) {
                const dx = (Math.random() - 0.5) * shakeTime;
                const dy = (Math.random() - 0.5) * shakeTime;
                ctx.translate(dx, dy);
                shakeTime *= 0.9; // dampen
                if (shakeTime < 0.5) shakeTime = 0;
            }

            // Clear screen with motion blur effect (alpha rect)
            ctx.globalCompositeOperation = 'source-over';
            ctx.fillStyle = 'rgba(5, 5, 8, 0.3)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Additive blending for gorgeous glowing visuals
            ctx.globalCompositeOperation = 'lighter';

            // Draw Entities
            particles.forEach(p => p.draw(ctx));
            projectiles.forEach(p => p.draw(ctx));
            enemies.forEach(e => e.draw(ctx));
            player.draw(ctx);

            ctx.restore(); // Remove shake translation
        }
    </script>
</body>
</html>
